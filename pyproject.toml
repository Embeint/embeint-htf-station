[project]
name = "embeint-htf-station"
version = "0.2.0"
description = "Extensible Python runtime for Embeint hardware test stations"
readme = "README.md"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE.md"]
keywords = ["hardware-testing", "manufacturing", "mqtt", "test-station"]
authors = [
    { name = "Karl Von Richter", email = "karl@embeint.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "filelock>=3.20",
    "aiomqtt>=2.5.1",
    "click>=8.3.2",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
]

[project.urls]
Homepage = "https://github.com/Embeint/embeint-htf-station"
Documentation = "https://github.com/Embeint/embeint-htf-station#readme"
Repository = "https://github.com/Embeint/embeint-htf-station"
Issues = "https://github.com/Embeint/embeint-htf-station/issues"

[project.scripts]
embeint-htf-station = "embeint_htf_station:main"
htf-station = "embeint_htf_station:main"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/embeint_htf_station"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]
