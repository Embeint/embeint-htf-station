# MQTT connection details. Values come from the environment so this file can be
# committed safely and reused across stations.
mqtt:
  host: ${HTF_MQTT_HOST:-localhost}
  port: ${HTF_MQTT_PORT:-1883}
  username: ${HTF_MQTT_USERNAME:-}
  password: ${HTF_MQTT_PASSWORD:-}

server:
  api_base_url: ${HTF_API_BASE_URL:-http://localhost:5080}
  station_key: ${HTF_API_KEY:-}

station:
  org_id: ${HTF_ORG_ID}
  station_id: ${HTF_STATION_ID}

programmers:
  - name: jlink_1
    kind: jlink
    serial_number: 823000667
    target_device: nrf54l15_m33
    rtt_channel: 0
    rtt_telnet_port: 19021

stages:
  - name: Device Erase
    kind: nrfutil_device_recover
    programmer: jlink_1
  - name: Flash Firmware
    kind: firmware_flash
    programmer: jlink_1
    firmware_id: 12b0cbe8-71d9-43fa-97b3-02202cf7d593
    firmware_version: latest
    path: zephyr/zephyr.hex
  - name: Validation
    kind: infuse_validation_rtt
    programmer: jlink_1
    reset_before_capture: true
    number_of_tests: 10
    test_timeout_seconds: 60
    tests: [BT, MODEM, DISK, FLASH, LED, IMU]
