name: CI

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv run ruff check .
      - name: Test with coverage
        run: uv run pytest --cov=embeint_htf_station --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Verify real Mosquitto TLS and mTLS
        run: HTF_TLS_INTEGRATION=1 uv run pytest tests/test_tls_integration.py tests/test_certificate_renewal.py
      - name: Report coverage
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as et

          root = et.parse("coverage.xml").getroot()
          line_rate = float(root.attrib["line-rate"]) * 100
          branch_rate = float(root.attrib["branch-rate"]) * 100
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Station coverage\n\n")
              summary.write("| Lines | Branches | Enforced line floor |\n|---:|---:|---:|\n")
              summary.write(f"| {line_rate:.2f}% | {branch_rate:.2f}% | 60% |\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: station-coverage
          path: coverage.xml
      - run: ./scripts/gen-mqtt-contracts.sh
      - run: git diff --exit-code -- src/embeint_htf_station/contracts/mqtt.py
      - run: uv build
