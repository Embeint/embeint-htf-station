name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv run ruff check .
      - run: uv run pytest
      - run: ./scripts/gen-mqtt-contracts.sh
      - run: git diff --exit-code -- src/embeint_htf_station/contracts/mqtt.py
      - run: uv build
